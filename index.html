<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>magnaye-ca. | designer & student</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:ital,wght@0,600;0,700;1,600&family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">

<style>
  * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root{
    --bg-color: #dce5ee;
    --navy-dark: #08162d;
    --navy-accent: #173667;
    --navy-card: #0d234a;
    --box-bg: rgba(228, 237, 246, 0.92);
    --font-title: 'Playfair Display', 'DM Serif Display', Georgia, serif;
    --font-cursive: 'Dancing Script', 'Caveat', cursive;
    --font-mono: 'Space Mono', 'Courier New', monospace;
  }

  html, body{
    width: 100%;
    min-height: 100vh;
    background-color: var(--bg-color);
    color: var(--navy-dark);
    font-family: var(--font-mono);
    position: relative;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    -webkit-font-smoothing: antialiased;
  }

  .pixel-art{
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-crisp-edges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  header{
    width: 100%;
    padding: 24px 36px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    position: relative;
    z-index: 20;
    gap: 12px;
  }

  .header-left, .header-right{
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-btn{
    font-family: var(--font-mono);
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--navy-dark);
    background: #ffffff;
    border: 2px solid var(--navy-dark);
    box-shadow: 3px 3px 0px var(--navy-dark);
    border-radius: 3px;
    padding: 6px 14px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-block;
  }
  .icon-btn:hover{
    transform: translateY(-2px);
    box-shadow: 4px 4px 0px var(--navy-dark);
    background: #f0f5fc;
  }

  .smile-badge-container{
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    cursor: pointer;
  }
  .smile-face{
    font-family: var(--font-mono);
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--navy-dark);
    background: rgba(255,255,255,0.92);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--navy-dark);
    box-shadow: 2px 2px 0px var(--navy-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 2;
  }
  .smile-face::before{ content: ":)"; }
  .smile-badge-container:hover .smile-face{
    transform: scale(1.1);
    background: #ffffff;
    box-shadow: 0 0 12px rgba(23,54,103,0.3), 3px 3px 0px var(--navy-dark);
  }
  .circling-text-svg{
    position: absolute;
    width: 80px;
    height: 80px;
    top: -18px;
    left: -18px;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    transform: scale(0.7) rotate(0deg);
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .smile-badge-container:hover .circling-text-svg{
    opacity: 1;
    transform: scale(1) rotate(360deg);
    animation: spinCircle 8s linear infinite 0.4s;
  }
  .circling-text-path{
    font-family: var(--font-mono), 'Noto Sans JP', sans-serif;
    font-size: 7.5px;
    font-weight: 700;
    fill: var(--navy-dark);
    letter-spacing: 1.4px;
    text-transform: uppercase;
  }
  @keyframes spinCircle{ from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }

  main{
    position: relative;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 10px 20px;
    margin: auto 0;
    width: 100%;
  }

  .hero-wrapper{
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 500px;
    width: 100%;
  }

  .site-title{
    font-family: var(--font-title);
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    font-weight: 900;
    color: var(--navy-dark);
    line-height: 1;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    user-select: none;
  }

  .site-subtitle{
    font-family: var(--font-cursive);
    font-size: clamp(1.3rem, 3vw, 1.7rem);
    font-weight: 700;
    font-style: italic;
    color: var(--navy-accent);
    margin-bottom: 24px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  .maple-leaf-icon{ font-style: normal; }

  .nav-box{
    background: var(--box-bg);
    border: 2px solid var(--navy-dark);
    box-shadow: 4px 4px 0px var(--navy-dark);
    border-radius: 2px;
    padding: 22px 28px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 26px;
  }

  .nav-row{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1.5px solid var(--navy-dark);
  }
  .nav-row:last-child{ border-bottom: none; }

  .nav-icon{
    font-size: 1.4rem;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .nav-link{
    font-family: var(--font-mono);
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--navy-dark);
    text-decoration: underline;
    cursor: pointer;
    text-align: left;
    flex-grow: 1;
    transition: color 0.15s ease;
  }
  .nav-link:hover{ color: #0b328a; }

  .lofi-pill-btn{
    background-color: var(--navy-card);
    color: #ffffff;
    font-family: var(--font-mono);
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    padding: 12px 32px;
    border-radius: 9999px;
    border: 2px solid var(--navy-dark);
    box-shadow: 0 4px 12px rgba(8,22,45,0.4), 0 3px 0px var(--navy-dark);
    transition: all 0.2s ease;
    cursor: pointer;
    display: inline-block;
    letter-spacing: 0.5px;
    margin-bottom: 20px;
  }
  .lofi-pill-btn:hover{
    background-color: #173872;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(8,22,45,0.5), 0 4px 0px var(--navy-dark);
  }

  .me-gif-wrapper{
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .me-gif{
    width: 130px;
    max-width: 55vw;
    height: auto;
    border-radius: 50%;
    border: 2px solid var(--navy-dark);
    box-shadow: 3px 3px 0px var(--navy-dark);
    background: #ffffff;
    display: block;
  }

  footer{
    width: 100%;
    padding: 24px 36px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 20;
  }

  .footer-credit{
    font-family: var(--font-cursive);
    font-size: 1.35rem;
    font-weight: 700;
    font-style: italic;
    color: var(--navy-accent);
    user-select: none;
  }

  .avatar-callout{
    position: fixed;
    right: 36px;
    bottom: 20px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    background: rgba(255,255,255,0.9);
    padding: 8px 14px 8px 16px;
    border-radius: 40px;
    border: 2px solid var(--navy-dark);
    box-shadow: 3px 3px 0px var(--navy-dark);
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: pointer;
    z-index: 30;
  }
  .avatar-callout:hover{
    transform: translateY(-3px) scale(1.02);
    box-shadow: 5px 5px 0px var(--navy-dark);
    background: #ffffff;
  }
  .avatar-speech{
    text-align: right;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    font-weight: 700;
    line-height: 1.25;
    color: var(--navy-dark);
    user-select: none;
  }
  .avatar-speech .arrow-text{ font-size: 0.95rem; display: inline-block; margin-left: 2px; }
  .avatar-circle{
    width: 44px;
    height: 44px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--navy-dark);
    background-color: #ffffff;
    flex-shrink: 0;
  }
  .avatar-circle img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .modal-backdrop{
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(8,22,45,0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.active{ display: flex; animation: modalFadeIn 0.2s ease-out; }
  .modal-card{
    background: #ffffff;
    border: 3px solid var(--navy-dark);
    box-shadow: 8px 8px 0px var(--navy-dark);
    max-width: 420px;
    width: 100%;
    padding: 32px 26px;
    text-align: center;
    border-radius: 4px;
    position: relative;
  }
  .modal-barrier-icon{ font-size: 3rem; margin-bottom: 10px; display: inline-block; animation: coneWiggle 2s ease-in-out infinite; }
  .modal-header-title{ font-family: var(--font-title); font-size: 1.9rem; font-weight: 900; color: var(--navy-dark); margin-bottom: 8px; }
  .modal-item-badge{ font-family: var(--font-mono); font-size: 0.95rem; font-weight: 700; color: #0b328a; background: #eef4fc; display: inline-block; padding: 4px 14px; border: 1.5px dashed var(--navy-dark); border-radius: 4px; margin-bottom: 16px; }
  .modal-body-text{ font-family: var(--font-mono); font-size: 0.9rem; color: #2c3e55; line-height: 1.5; margin-bottom: 24px; }
  .modal-visit-link{
    font-family: var(--font-mono);
    font-size: 0.95rem;
    font-weight: 700;
    color: #0b328a;
    background: #eef4fc;
    display: inline-block;
    padding: 8px 18px;
    border: 1.5px dashed var(--navy-dark);
    border-radius: 4px;
    margin-bottom: 24px;
    text-decoration: underline;
    word-break: break-all;
  }
  .modal-visit-link:hover{ color: #08162d; background: #dfeaf9; }
  .return-home-btn{
    font-family: var(--font-mono); font-size: 0.95rem; font-weight: 700; color: #ffffff;
    background-color: var(--navy-dark); border: 2px solid var(--navy-dark); box-shadow: 4px 4px 0px #173667;
    padding: 10px 26px; border-radius: 4px; cursor: pointer; transition: all 0.15s ease; display: inline-block; text-decoration: none;
  }
  .return-home-btn:hover{ background-color: #173872; transform: translateY(-2px); box-shadow: 5px 5px 0px var(--navy-dark); }
  @keyframes modalFadeIn{ from{ opacity: 0; transform: scale(0.95); } to{ opacity: 1; transform: scale(1); } }
  @keyframes coneWiggle{ 0%,100%{ transform: translateY(0) rotate(0deg); } 25%{ transform: translateY(-4px) rotate(-3deg); } 75%{ transform: translateY(-4px) rotate(3deg); } }

  @media (max-width: 768px){
    header{ padding: 16px 20px; }
    footer{ padding: 16px 20px; }
    .avatar-callout{ right: 16px; bottom: 16px; }
    .nav-box{ padding: 16px 18px; }
  }
</style>
</head>
<body>

  <header>
    <div class="header-right">
      <div class="smile-badge-container" title="hey!">
        <svg class="circling-text-svg" viewBox="0 0 100 100">
          <defs>
            <path id="circlePath" d="M 50, 50 m -36, 0 a 36,36 0 1,1 72,0 a 36,36 0 1,1 -72,0" />
          </defs>
          <text class="circling-text-path">
            <textPath href="#circlePath" startOffset="49%" text-anchor="middle">hello &bull; hola &bull; bonjour &bull; gentlepeeps! </textPath>
          </text>
        </svg>
        <div class="smile-face"></div>
      </div>
    </div>
  </header>

  <main>
    <div class="hero-wrapper">
      <h1 class="site-title">magnaye-ca.</h1>
      <p class="site-subtitle">designer <span class="maple-leaf-icon">🍁</span> | student</p>

      <div class="nav-box">
        <div class="nav-row">
          <span class="nav-icon">👁️</span>
          <a class="nav-link" href="javascript:void(0)" onclick="showUnderConstruction('about me', 'about')">about me</a>
        </div>
        <div class="nav-row">
          <span class="nav-icon">🖥️</span>
          <a class="nav-link" href="javascript:void(0)" onclick="showUnderConstruction('blog', 'blog')">blog</a>
        </div>
        <div class="nav-row">
          <span class="nav-icon">🏢</span>
          <a class="nav-link" href="javascript:void(0)" onclick="showUnderConstruction('my store')">my store</a>
        </div>
        <div class="nav-row">
          <span class="nav-icon">🤖</span>
          <a class="nav-link" href="javascript:void(0)" onclick="showUnderConstruction('contact')">contact</a>
        </div>
      </div>

      <!-- Now links directly to the Fireplace Lofi page instead of the "coming soon" popup -->
      <a class="lofi-pill-btn" href="lofi.html">lofi web lab</a>

      <!-- Simple "me" image, centered below the Lo-Fi Web Lab button -->
      <div class="me-gif-wrapper">
        <img src="giphy-carlo.gif" alt="Carlo Angelo Magnaye animated pixel avatar" class="me-gif pixel-art">
      </div>
    </div>
  </main>

  <!-- "built by" text now unboxed, styled in the site's cursive font -->
  <footer>
    <div class="footer-credit">built by carlo angelo magnaye</div>
  </footer>

  <!-- Pixel avatar back to its original bottom-right position, linking straight to the CV page -->
  <a href="carlo-cvwaves.html" class="avatar-callout" title="View Carlo Angelo Magnaye's CV">
    <div class="avatar-speech">my creative cv~ish <span class="arrow-text">&rarr;</span></div>
    <div class="avatar-circle">
      <img src="magnaye-ca pixels.jpg" alt="Carlo Angelo Magnaye Pixel Avatar" class="pixel-art">
    </div>
  </a>

  <div class="modal-backdrop" id="constructionModal" onclick="closeUnderConstruction(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-barrier-icon" id="modalIcon">🚧</div>
      <h2 class="modal-header-title" id="modalHeaderTitle">UNDER CONSTRUCTION</h2>
      <div class="modal-item-badge" id="modalSectionTitle">Page</div>
      <p class="modal-body-text" id="modalBodyText">This page is currently under construction and being crafted with care. Please check back soon!</p>
      <a class="modal-visit-link" id="modalVisitLink" href="#" target="_blank" rel="noopener" style="display:none;">visit magnaye-ca.univer.se &rarr;</a>
      <button class="return-home-btn" onclick="closeUnderConstruction()">&larr; Return to Main Page</button>
    </div>
  </div>

  <script>
    function showUnderConstruction(section, type){
      var icon = document.getElementById('modalIcon');
      var headerTitle = document.getElementById('modalHeaderTitle');
      var bodyText = document.getElementById('modalBodyText');
      var visitLink = document.getElementById('modalVisitLink');

      document.getElementById('modalSectionTitle').textContent = section;

      if(type === 'about'){
        icon.textContent = '🙂';
        headerTitle.textContent = 'HEY, THAT\'S ME!';
        bodyText.textContent = 'Click below to check out my full about me page.';
        visitLink.href = 'https://magnaye-ca.univer.se/';
        visitLink.textContent = 'visit magnaye-ca.univer.se \u2192';
        visitLink.style.display = 'inline-block';
      } else if(type === 'blog'){
        icon.textContent = '✍️';
        headerTitle.textContent = 'HEY, GLAD YOU STOPPED BY!';
        bodyText.textContent = 'This is where I jot down thoughts, projects, and behind-the-scenes stuff. Click below to read the full blog.';
        visitLink.href = 'https://carlo-blogson.univer.se/';
        visitLink.textContent = 'visit carlo-blogson.univer.se \u2192';
        visitLink.style.display = 'inline-block';
      } else {
        icon.textContent = '🚧';
        headerTitle.textContent = 'UNDER CONSTRUCTION';
        bodyText.textContent = 'This page is currently under construction and being crafted with care. Please check back soon!';
        visitLink.style.display = 'none';
      }

      document.getElementById('constructionModal').classList.add('active');
    }
    function closeUnderConstruction(){
      document.getElementById('constructionModal').classList.remove('active');
    }
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape') closeUnderConstruction();
    });
  </script>

</body>
</html>
