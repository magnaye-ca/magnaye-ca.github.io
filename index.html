<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>magnaye-ca.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #dbe6f0;
      --navy: #0e2242;
      --navy-light: #1b3560;
      --link-blue: #0000aa;
      --border-color: #0e2242;
      --box-bg: #eaf1f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--navy);
      font-family: 'Courier Prime', monospace, 'Courier New', Courier;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
      position: relative;
    }

    /* Top Navigation */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .top-links {
      display: flex;
      gap: 12px;
    }

    .retro-btn {
      display: inline-block;
      padding: 4px 10px;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      box-shadow: 2px 2px 0 var(--border-color);
      color: var(--navy);
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.1s;
    }

    .retro-btn:hover {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--border-color);
      background: #f0f4f8;
    }

    .retro-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .counter {
      font-size: 15px;
      font-weight: bold;
      color: var(--navy);
      letter-spacing: 1px;
    }

    /* Main Center Section */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 30px 0;
    }

    .title-header {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 1.2rem;
      font-style: italic;
      color: var(--navy);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .maple-leaf {
      color: #e03131;
      font-style: normal;
    }

    /* 90s Navigation Style Box */
    .retro-nav-container {
      background-color: var(--box-bg);
      border: 2px solid var(--navy);
      box-shadow: 4px 4px 0 var(--navy);
      padding: 20px 28px;
      width: 100%;
      max-width: 460px;
      margin-bottom: 26px;
      text-align: left;
    }

    .retro-menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .retro-menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* 3D Beveled Icon Frame */
    .retro-icon-frame {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      background: #000000;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #555555;
      border-bottom: 2px solid #555555;
      box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #222222;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .retro-icon-frame svg {
      width: 26px;
      height: 26px;
    }

    .retro-link-wrapper {
      flex-grow: 1;
      border-bottom: 1.5px solid var(--link-blue);
      padding-bottom: 3px;
    }

    .retro-link {
      color: var(--link-blue);
      font-family: 'Times New Roman', Times, serif;
      font-size: 1.15rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      transition: color 0.15s;
    }

    .retro-link:hover {
      color: #b30000;
    }

    /* Lo-Fi Web Lab Button */
    .lofi-pill {
      display: inline-block;
      background: var(--navy);
      color: #ffffff;
      padding: 12px 30px;
      border-radius: 28px;
      font-size: 0.95rem;
      font-family: 'Courier Prime', monospace;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(14, 34, 66, 0.25);
      transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .lofi-pill:hover {
      transform: translateY(-2px);
      background-color: var(--navy-light);
      box-shadow: 0 6px 18px rgba(14, 34, 66, 0.35);
    }

    /* Footer */
    .footer-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100%;
      margin-top: auto;
    }

    .built-by-box {
      padding: 6px 14px;
      background: #ffffff;
      border: 1.5px solid var(--navy);
      box-shadow: 2px 2px 0 var(--navy);
      font-size: 13px;
      font-weight: bold;
      color: var(--navy);
    }

    /* Bottom-Right LinkedIn Button */
    .linkedin-hover-badge {
      position: absolute;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 2px solid var(--navy);
      border-radius: 24px;
      padding: 8px 16px;
      box-shadow: 3px 3px 0 var(--navy);
      text-decoration: none;
      color: var(--navy);
      transition: transform 0.15s, box-shadow 0.15s, background-color 0.15s;
    }

    .linkedin-hover-badge:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--navy);
      background-color: #f0f7ff;
    }

    .badge-text {
      font-size: 12px;
      line-height: 1.2;
      text-align: left;
    }

    .badge-btn-tag {
      background: var(--navy);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }
      .footer-bar {
        flex-direction: column;
        gap: 16px;
      }
      .linkedin-hover-badge {
        position: static;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="top-links">
      <a href="https://github.com" target="_blank" class="retro-btn">[GitHub]</a>
      <a href="https://linkedin.com" target="_blank" class="retro-btn">[LinkedIn]</a>
    </div>
    <div class="counter">(0)</div>
  </header>

  <!-- Center Content -->
  <main class="main-content">
    <h1 class="title-header">magnaye-ca.</h1>
    <div class="subtitle">
      <span>designer</span>
      <span class="maple-leaf">🍁</span>
      <span>|</span>
      <span>student</span>
    </div>

    <!-- 90s Navigation Style Box -->
    <nav class="retro-nav-container" aria-label="Main Navigation">
      <ul class="retro-menu-list">
        
        <!-- About Me -->
        <li class="retro-menu-item">
          <div class="retro-icon-frame">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="16" height="16" fill="#1c3a6b"/>
              <path d="M2 8C2 8 5 4 8 4C11 4 14 8 14 8C14 8 11 12 8 12C5 12 2 8 2 8Z" fill="#ffffff"/>
              <circle cx="8" cy="8" r="3" fill="#2d72d9"/>
              <circle cx="8" cy="8" r="1.5" fill="#000000"/>
              <rect x="7" y="6" width="1" height="1" fill="#ffffff"/>
            </svg>
          </div>
          <div class="retro-link-wrapper">
            <a href="#about" class="retro-link">about me</a>
          </div>
        </li>

        <!-- Blog -->
        <li class="retro-menu-item">
          <div class="retro-icon-frame">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="16" height="16" fill="#1c3a6b"/>
              <rect x="3" y="2" width="10" height="8" fill="#d9d9d9" stroke="#ffffff" stroke-width="0.5"/>
              <rect x="4" y="3" width="8" height="6" fill="#00ffff"/>
              <rect x="6" y="10" width="4" height="2" fill="#aaaaaa"/>
              <rect x="4" y="12" width="8" height="2" fill="#ffffff"/>
            </svg>
          </div>
          <div class="retro-link-wrapper">
            <a href="#blog" class="retro-link">blog</a>
          </div>
        </li>

        <!-- My Store -->
        <li class="retro-menu-item">
          <div class="retro-icon-frame">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="16" height="16" fill="#c49a20"/>
              <rect x="2" y="5" width="4" height="9" fill="#111111"/>
              <rect x="7" y="3" width="5" height="11" fill="#222222"/>
              <rect x="13" y="7" width="2" height="7" fill="#111111"/>
              <rect x="3" y="6" width="1" height="1" fill="#ffff00"/>
              <rect x="8" y="5" width="1" height="1" fill="#ffff00"/>
              <rect x="10" y="5" width="1" height="1" fill="#ffff00"/>
              <rect x="8" y="8" width="1" height="1" fill="#ffff00"/>
            </svg>
          </div>
          <div class="retro-link-wrapper">
            <a href="#store" class="retro-link">my store</a>
          </div>
        </li>

        <!-- Contact -->
        <li class="retro-menu-item">
          <div class="retro-icon-frame">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="16" height="16" fill="#008060"/>
              <rect x="4" y="4" width="8" height="8" fill="#112211"/>
              <rect x="6" y="6" width="4" height="4" fill="#0055ff"/>
              <line x1="2" y1="5" x2="4" y2="5" stroke="#ffffff"/>
              <line x1="2" y1="8" x2="4" y2="8" stroke="#ffffff"/>
              <line x1="2" y1="11" x2="4" y2="11" stroke="#ffffff"/>
              <line x1="12" y1="5" x2="14" y2="5" stroke="#ffffff"/>
              <line x1="12" y1="8" x2="14" y2="8" stroke="#ffffff"/>
              <line x1="12" y1="11" x2="14" y2="11" stroke="#ffffff"/>
            </svg>
          </div>
          <div class="retro-link-wrapper">
            <a href="#contact" class="retro-link">contact</a>
          </div>
        </li>

      </ul>
    </nav>

    <!-- Lo-Fi Web Lab Pill -->
    <a href="#lofi-lab" class="lofi-pill">Lo-Fi Web Lab [Coming Soon]</a>
  </main>

  <!-- Footer -->
  <footer class="footer-bar">
    <div class="built-by-box">
      built by magnaye-ca
    </div>

    <!-- LinkedIn Button on Bottom Right -->
    <a href="https://linkedin.com" target="_blank" class="linkedin-hover-badge" aria-label="LinkedIn profile">
      <div class="badge-text">
        hey this &rarr;<br>
        is me lol
      </div>
      <div class="badge-btn-tag">LinkedIn button here</div>
    </a>
  </footer>

</body>
</html>
