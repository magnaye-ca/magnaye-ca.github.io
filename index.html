<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>magnaye-ca — designer 🍁 | student</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* Reset & CSS Theme Variables */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #dce5ee;
      --navy-deep: #08162d;
      --navy-dark: #0f244a;
      --navy-accent: #1e3a68;
      --text-contrast: #061224;
      --pill-bg: #0d234a;
      --pill-hover: #16366f;
      --card-bg: rgba(255, 255, 255, 0.92);
      --font-cursive: 'Dancing Script', 'Caveat', cursive;
      --font-speech: 'Caveat', cursive;
      --font-mono: 'Space Mono', 'Courier Prime', monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-contrast);
      font-family: var(--font-mono);
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Pixel art rendering helper */
    .pixel-art {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Background Wave Artwork */
    .wave-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wave-background img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0.95;
    }

    /* Header Navigation */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 36px;
      z-index: 10;
      position: relative;
    }

    .top-links {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .top-link {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: var(--navy-deep);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 6px 12px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(8, 22, 45, 0.15);
      box-shadow: 2px 2px 0px rgba(8, 22, 45, 0.2);
      transition: all 0.2s ease;
    }

    .top-link:hover {
      background: #ffffff;
      color: #0b4594;
      transform: translateY(-2px);
      box-shadow: 3px 3px 0px var(--navy-deep);
    }

    .top-counter {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--navy-deep);
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(8, 22, 45, 0.1);
    }

    /* Main Central Section */
    main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
      margin: auto 0;
    }

    .hero-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 32px;
      border-radius: 24px;
      background: radial-gradient(ellipse at center, rgba(220, 229, 238, 0.85) 0%, rgba(220, 229, 238, 0.4) 65%, rgba(220, 229, 238, 0) 100%);
    }

    /* Brand Title */
    .brand-title {
      font-family: var(--font-cursive);
      font-size: clamp(3.4rem, 7.5vw, 5.4rem);
      font-weight: 700;
      color: var(--navy-deep);
      line-height: 1.1;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
      text-shadow: 
        0 0 16px rgba(255, 255, 255, 0.98),
        0 0 6px #ffffff,
        0 2px 8px rgba(255, 255, 255, 0.9),
        -1.5px -1.5px 0 #ffffff,
        1.5px -1.5px 0 #ffffff,
        -1.5px 1.5px 0 #ffffff,
        1.5px 1.5px 0 #ffffff;
    }

    /* Subtitle with Maple Leaf */
    .brand-subtitle {
      font-family: var(--font-mono);
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 700;
      color: var(--navy-accent);
      letter-spacing: 2px;
      margin-bottom: 22px;
      text-shadow: 
        0 0 8px rgba(255, 255, 255, 0.95),
        0 1px 3px #ffffff,
        1px 1px 0 #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .maple-leaf {
      font-style: normal;
      display: inline-block;
      transform-origin: center;
      transition: transform 0.3s ease;
    }

    .brand-subtitle:hover .maple-leaf {
      transform: rotate(15deg) scale(1.15);
    }

    /* Retro Navigation Box */
    .menu-box {
      background-color: var(--card-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 2px solid var(--navy-deep);
      box-shadow: 4px 4px 0px var(--navy-deep);
      padding: 10px 28px;
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      border-radius: 2px;
    }

    .menu-box a {
      color: var(--navy-deep);
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .menu-box a:hover {
      color: #0b4594;
      text-decoration: underline;
      transform: translateY(-1px);
    }

    .menu-box .divider {
      color: var(--navy-deep);
      font-weight: 900;
      user-select: none;
    }

    /* Lo-Fi Pill Button */
    .cta-pill {
      background-color: var(--pill-bg);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 9999px;
      border: 2px solid var(--navy-deep);
      box-shadow: 0 4px 14px rgba(8, 22, 45, 0.4), 0 3px 0px var(--navy-deep);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      display: inline-block;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .cta-pill:hover {
      background-color: var(--pill-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(8, 22, 45, 0.55), 0 4px 0px var(--navy-deep);
      color: #f4f8ff;
    }

    /* Floating Spaceship Animation */
    .spaceship-container {
      margin-top: 10px;
      position: relative;
      animation: floatShip 3.5s ease-in-out infinite;
    }

    .spaceship-sprite {
      width: 200px;
      max-width: 80vw;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(8, 22, 45, 0.35));
    }

    @keyframes floatShip {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    /* Footer & Profile Callout */
    footer {
      width: 100%;
      padding: 24px 40px;
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .footer-credits {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--navy-deep);
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.95), 0 1px 2px #ffffff;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(4px);
      padding: 5px 12px;
      border-radius: 4px;
      border: 1px solid rgba(8, 22, 45, 0.15);
    }

    /* Interactive LinkedIn Profile Callout */
    .profile-callout {
      position: absolute;
      right: 40px;
      bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 8px 14px 8px 16px;
      border-radius: 36px;
      border: 2px solid var(--navy-deep);
      box-shadow: 3px 3px 0px var(--navy-deep);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .profile-callout:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 5px 5px 0px var(--navy-deep);
      background: #ffffff;
    }

    .speech-bubble {
      text-align: right;
      font-family: var(--font-speech);
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.15;
      color: var(--navy-deep);
      letter-spacing: 0.3px;
      user-select: none;
    }

    .avatar-wrapper {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid var(--navy-deep);
      background-color: #ffffff;
      flex-shrink: 0;
      position: relative;
      transition: transform 0.25s ease;
    }

    .profile-callout:hover .avatar-wrapper {
      transform: rotate(6deg) scale(1.08);
      border-color: #0b4594;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
      }
      .top-links {
        gap: 10px;
      }
      .top-link {
        font-size: 0.85rem;
        padding: 4px 8px;
      }
      .menu-box {
        gap: 10px;
        padding: 8px 16px;
      }
      .menu-box a, .menu-box .divider {
        font-size: 0.9rem;
      }
      footer {
        flex-direction: column-reverse;
        gap: 18px;
        padding: 16px 20px 24px;
      }
      .profile-callout {
        position: static;
        margin-top: 5px;
      }
      .spaceship-sprite {
        width: 160px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Wave Artwork -->
  <div class="wave-background">
    <img 
      src="magnaye-ca background.jpg" 
      alt="Pixel Great Wave Background" 
      class="pixel-art" 
    />
  </div>

  <!-- Header Navigation -->
  <header>
    <div class="top-links">
      <a href="https://github.com/magnayeca" target="_blank" rel="noopener noreferrer" class="top-link">[GitHub]</a>
      <a href="https://ko-fi.com/magnayeca" target="_blank" rel="noopener noreferrer" class="top-link">[Buy Me Coffee]</a>

    <div class="top-counter">(0)</div>
  </header>

  <!-- Central Hero Section -->
  <main>
    <div class="hero-container">

      <p class="brand-subtitle">designer <span class="maple-leaf">🍁</span> | student</p>

      <!-- Navigation Menu Box -->
      <nav class="menu-box">
        <a href="#about">about me</a>
        <span class="divider">|</span>
        <a href="#blog">blog</a>
        <span class="divider">|</span>
        <a href="#store">my store</a>

        <a href="#contact">contact</a>
      </nav>

      <!-- CTA Pill Button -->
      <a href="#lofi-lab" class="cta-pill">Lo-Fi Web Lab [Coming Soon]</a>

      <!-- Animated Spaceship -->
      <div class="spaceship-container">
        <img 
          src="spaceship.png" 
          alt="Pixel Art Spaceship" 
          class="spaceship-sprite pixel-art" 
        />
      </div>
    </div>
  </main>

  <!-- Footer with Interactive LinkedIn Avatar -->
  <footer>
    <div class="footer-credits">built by magnaye-ca</div>

    <!-- Clickable Avatar linking to LinkedIn -->
    <a 
      href="https://www.linkedin.com/in/carlomagnaye" 
      target="_blank" 
      rel="noopener noreferrer" 
      class="profile-callout" 
      title="Visit Carlo Magnaye on LinkedIn"
    >
      <div class="speech-bubble">
        hey this &rarr;<br>is me lol
      </div>
      <div class="avatar-wrapper">
        <img 
          src="magnaye-ca pixels.jpg" 
          alt="Carlo Magnaye Pixel Avatar" 
          class="pixel-art" 
        />
      </div>
    </a>
  </footer>

</body>
</html>
